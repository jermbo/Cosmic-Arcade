<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
		<meta name="theme-color" content="#8fc6ec" />
		<meta name="description" content="A cozy elf builder on floating sky islands. Grow tree homes, draw moss paths, and unlock a chain of islands." />
		<link rel="icon" type="image/svg+xml" href="favicon.svg" />
		<title>Petalwisp Isles</title>
	</head>
	<body>
		<canvas class="stage" id="stage" aria-label="Your sky islands"></canvas>

		<div class="ui">
			<header class="hud" id="hud" hidden>
				<button class="round" id="btn-pause" type="button" aria-label="Pause">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12" /></svg>
				</button>
				<button class="goal" id="btn-goal" type="button" aria-label="Goals">
					<span class="goal__label">Goal</span>
					<span class="goal__text" id="goal-text"></span>
					<span class="goal__count" id="goal-count"></span>
				</button>
				<button class="round" id="btn-isles" type="button" aria-label="Islands">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-3 5-3 1-2 5-2-5-3-1zM9 9c0-3 1.500-5 3-5s3 2 3 5" /></svg>
				</button>
				<button class="round" id="btn-folk" type="button" aria-label="Elves">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l-3 6h6zM8.5 10a3 3 0 1 0 1 0M4 21c0-4 2.5-6 5-6s5 2 5 6M17 7a2.500 2.500 0 1 0 0 .1M14.500 21c.5-3 1.500-5 3-5s3 1.500 3.500 5" /></svg>
				</button>
				<button class="round" id="btn-book" type="button" aria-label="Book of magic links">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2-1.5-4.5-2-8-2v13c3.500 0 6 .5 8 2 2-1.500 4.500-2 8-2V5c-3.500 0-6 .5-8 2zM12 7v13" /></svg>
					<span class="round__badge" id="book-count">0</span>
				</button>
			</header>

			<div class="dock" id="dock" hidden>
				<p class="dock__hint" id="hint"></p>
				<div class="roadbar" id="roadbar" hidden>
					<span class="roadbar__text" id="roadbar-text"></span>
					<button class="btn btn--ghost" id="road-no" type="button">Cancel</button>
					<button class="btn btn--big" id="road-yes" type="button">Build</button>
				</div>
				<div class="flyout" id="flyout" role="group" aria-label="Types" hidden></div>
				<div class="dock__tools dock__tools--start">
					<button class="round" id="btn-undo" type="button" aria-label="Undo">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l-5 5 5 5M4 10h10a5 5 0 0 1 0 10h-3" /></svg>
					</button>
					<button class="round" id="btn-redo" type="button" aria-label="Redo">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l5 5-5 5M20 10H10a5 5 0 0 0 0 10h3" /></svg>
					</button>
				</div>
				<div class="dock__pieces" id="pieces" role="toolbar" aria-label="Pieces"></div>
				<div class="dock__tools dock__tools--end">
					<button class="round" id="btn-rotate" type="button" aria-label="Turn the piece">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.600-5.900M20 4v5h-5" /></svg>
					</button>
					<button class="round" id="btn-erase" type="button" aria-label="Remove a piece" aria-pressed="false">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" /></svg>
					</button>
				</div>
			</div>

			<aside class="card" id="card" hidden aria-label="Elf"></aside>

			<div class="decor" id="decor" hidden>
				<div class="decor__top">
					<button class="round" id="decor-exit" type="button" aria-label="Leave the home">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
					</button>
					<p class="decor__name" id="decor-name"></p>
					<button class="btn btn--big decor__walk" id="decor-walk" type="button">Walk in</button>
				</div>
				<div class="decor__floors choices" id="decor-floors" role="group" aria-label="Floors"></div>
				<div class="decor__dock">
					<p class="dock__hint" id="decor-hint"></p>
					<div class="decor__sel" id="decor-sel" hidden></div>
					<div class="decor__cats" id="decor-cats" role="group" aria-label="Kinds of things"></div>
					<div class="decor__items" id="decor-items" role="toolbar" aria-label="Things"></div>
				</div>
			</div>

			<div class="drive" id="drive" hidden>
				<div class="drive__top">
					<button class="round" id="drive-exit" type="button" aria-label="Stop playing as this elf">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
					</button>
					<p class="drive__name"><small>Playing as</small> <b id="drive-name"></b></p>
					<button class="round" id="drive-view" type="button" aria-label="Switch to first person" aria-pressed="false">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.500-6 10-6 10 6 10 6-3.500 6-10 6S2 12 2 12zM12 9.500a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5z" /></svg>
					</button>
				</div>
				<p class="drive__hint" id="drive-hint"></p>
				<div class="drive__stick" id="drive-stick" hidden><i></i></div>
				<button class="btn btn--big drive__act" id="drive-act" type="button" hidden></button>
			</div>

			<div class="toasts" id="toasts" aria-live="polite"></div>
			<div class="banner" id="banner" hidden aria-live="polite"></div>

			<section class="title" id="title">
				<div class="title__logo">
					<p class="title__kicker">An elven sky grove</p>
					<h1>Petalwisp <em>Isles</em></h1>
				</div>
				<div class="title__buttons">
					<button class="btn btn--big" id="btn-play" type="button">Play</button>
					<button class="btn" id="btn-new" type="button" hidden>New islands</button>
					<button class="btn btn--ghost" id="btn-title-settings" type="button">Settings</button>
					<a class="btn btn--ghost" id="arcade-link" href="../" hidden>Back to the arcade</a>
				</div>
				<p class="title__note">No timers. No way to lose. Your islands save on this device.</p>
			</section>

			<div class="modal" id="modal" hidden>
				<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
					<header class="sheet__head">
						<h2 id="modal-title"></h2>
						<button class="round round--small" id="modal-close" type="button" aria-label="Close">
							<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
						</button>
					</header>
					<div class="sheet__body" id="modal-body"></div>
				</div>
			</div>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
